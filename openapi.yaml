    delete:
      operationId: deleteVolumeTag
      summary: Remove uma tag de volume
      tags:
      - Tags
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/SchemaParam'
      - $ref: '#/components/parameters/VolumeParam'
      - $ref: '#/components/parameters/TagKeyParam'
