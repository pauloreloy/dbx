openapi: 3.1.0
info:
  title: Databricks Governance Service
  version: 0.1.0
  summary: Governança de acessos e gestão de catálogo sobre o Databricks.
  description: |
    Microserviço interno de governança de dados sobre o Databricks (Unity Catalog).
    Expõe uma API de domínio, não um proxy 1:1 da API do Databricks.

    ## Multi-workspace
    Todas as rotas de recurso ficam sob `/v1/workspaces/{ws}`. `{ws}` é um **alias do registry** do
    serviço (resolvido para host e credenciais OAuth M2M, uma por workspace), e não o ID numérico do
    Databricks. Atenção: o Unity Catalog é **por metastore**, não por workspace. Dois workspaces ligados
    ao mesmo metastore enxergam os mesmos objetos, e um grant feito via `ws-a` vale também em `ws-b`.
    Por isso a auditoria registra `workspace` e `metastore_id`, e a rota de auditoria é global.

    ## Convenções
    - **Escritas** exigem `X-Change-Ref` (ticket/change) e geram evento de auditoria.
    - **Idempotência**: `Idempotency-Key` (obrigatório em criações, opcional em grant/revoke).
    - **Erros**: RFC 9457 (`application/problem+json`).
    - **Paginação**: `page_size` e `page_token` / `next_page_token`.
    - **Correlação**: `X-Request-Id` é aceito, gerado se ausente, devolvido e propagado ao Databricks.
    - **Autorização**: além do JWT/mTLS, o serviço aplica política própria (quem pode conceder o quê, em
      qual catálogo), independente das permissões do service principal no Databricks.

    ## Fora do escopo desta versão
    Criação de tabelas/views (exige SQL assíncrono e `/operations`), `grants/batch|plan|sync`,
    external locations, storage credentials, ABAC e gestão de grupos.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: https://databricks-governance.internal.example.com
  description: Substituir pelo host interno real.
security:
- bearerAuth: []
- mutualTLS: []
tags:
- name: Workspaces
  description: Registry de workspaces (somente leitura).
- name: Grants
  description: Leitura, concessão e revogação de privilégios.
- name: Principals
  description: Consulta de identidades (somente leitura).
- name: Catalogs
- name: Schemas
- name: Tables
- name: Views
- name: Volumes
- name: Ownership
  description: Propriedade de objetos.
- name: Tags
  description: Tags de objetos.
- name: Audit
  description: Trilha de auditoria do serviço.
- name: Operational
  description: Health checks (sem autenticação).
paths:
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      summary: Lista os workspaces registrados
      tags:
      - Workspaces
      description: Retorna apenas os workspaces que o chamador tem permissão de usar neste serviço.
      parameters:
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces/{ws}:
    get:
      operationId: getWorkspace
      summary: Detalha um workspace registrado
      tags:
      - Workspaces
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/workspaces/{ws}/principals:
    get:
      operationId: listPrincipals
      summary: Busca principals (usuários, grupos e service principals)
      tags:
      - Principals
      description: Somente leitura. Usado pelos consumidores para validar a existência de um principal antes de
        conceder privilégios. As identidades são gerenciadas no IdP (SCIM); este serviço não as altera.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/PrincipalTypeParam'
      - $ref: '#/components/parameters/SearchQueryParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: Lista eventos de auditoria
      tags:
      - Audit
      description: 'A auditoria é do serviço e atravessa todos os workspaces; por isso não fica sob `/workspaces/{ws}`.
        Use o filtro `workspace`. Ordenação: mais recentes primeiro.'
      parameters:
      - name: workspace
        in: query
        description: Filtra por alias de workspace.
        schema:
          type: string
      - name: actor
        in: query
        description: Subject (sub) do chamador que executou a ação.
        schema:
          type: string
      - name: action
        in: query
        schema:
          $ref: '#/components/schemas/AuditAction'
      - name: securable_type
        in: query
        schema:
          $ref: '#/components/schemas/SecurableType'
      - name: securable_name
        in: query
        description: 'Nome completo do objeto (ex.: prod.vendas.pedidos).'
        schema:
          type: string
      - name: principal
        in: query
        description: Principal-alvo de um grant/revoke.
        schema:
          type: string
      - name: change_ref
        in: query
        description: 'Valor de X-Change-Ref (ex.: ticket).'
        schema:
          type: string
      - name: outcome
        in: query
        schema:
          $ref: '#/components/schemas/AuditOutcome'
      - name: from
        in: query
        description: Início do intervalo (inclusivo).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Fim do intervalo (exclusivo).
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/audit/events/{event_id}:
    get:
      operationId: getAuditEvent
      summary: Detalha um evento de auditoria (inclui estado anterior e posterior)
      tags:
      - Audit
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      operationId: getLiveness
      summary: Liveness
      tags:
      - Operational
      security: []
      responses:
        '200':
          description: Processo ativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /readyz:
    get:
      operationId: getReadiness
      summary: Readiness (Postgres, Vault e registry carregados)
      tags:
      - Operational
      security: []
      responses:
        '200':
          description: Pronto para receber tráfego.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Dependência indisponível.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/workspaces/{ws}/catalogs:
    get:
      operationId: listCatalogs
      summary: Lista catalogs
      tags:
      - Catalogs
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createCatalog
      summary: Cria catalog
      tags:
      - Catalogs
      description: Execução síncrona. `Idempotency-Key` é obrigatório (DDL não é naturalmente idempotente).
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/IdempotencyKeyRequiredHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCreate'
      responses:
        '201':
          description: Criado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Location:
              description: URL do recurso criado.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/workspaces/{ws}/catalogs/{catalog}:
    get:
      operationId: getCatalog
      summary: Detalha catalog
      tags:
      - Catalogs
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateCatalog
      summary: Atualiza catalog (comentário, propriedades, renomeação)
      tags:
      - Catalogs
      description: Merge parcial; ao menos um campo é obrigatório. A troca de dono usa `PUT .../owner`.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogUpdate'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteCatalog
      summary: Remove catalog
      tags:
      - Catalogs
      description: '`confirm` deve ser igual ao nome completo do objeto, caso contrário 422 `confirmation-mismatch`.
        Objetos da lista de protegidos retornam 403 `protected-resource`. Com `force=false` (padrão), a remoção
        falha se o objeto não estiver vazio.'
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/ConfirmParam'
      - $ref: '#/components/parameters/ForceParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '204':
          description: Removido com sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/workspaces/{ws}/catalogs/{catalog}/grants:
    get:
      operationId: listCatalogGrants
      summary: Lista os grants diretos de catalog
      tags:
      - Grants
      description: Somente privilégios concedidos diretamente neste objeto (sem herança).
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/PrincipalFilterParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/workspaces/{ws}/catalogs/{catalog}/grants/grant:
    post:
      operationId: grantOnCatalog
      summary: Concede privilégios sobre catalog
      tags:
      - Grants
      description: |-
        Fluxo: (1) valida o corpo e a matriz de privilégios por tipo de objeto (422 `privilege-not-applicable`); (2) confirma que cada principal existe (422 `principal-not-found`); (3) aplica a política de autorização do serviço; (4) rejeita mudanças que removeriam privilégios de principals protegidos do workspace (409 `protected-principal`); (5) executa no Databricks; (6) grava o evento de auditoria. A operação é idempotente: repetir o mesmo corpo não gera erro e retorna `changed: false`.

        `X-Change-Ref` é obrigatório e vai para a auditoria. `Idempotency-Key` é opcional.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantChangeRequest'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/workspaces/{ws}/catalogs/{catalog}/grants/revoke:
    post:
      operationId: revokeOnCatalog
      summary: Revoga privilégios sobre catalog
      tags:
      - Grants
      description: |-
        Fluxo: (1) valida o corpo e a matriz de privilégios por tipo de objeto (422 `privilege-not-applicable`); (2) confirma que cada principal existe (422 `principal-not-found`); (3) aplica a política de autorização do serviço; (4) rejeita mudanças que removeriam privilégios de principals protegidos do workspace (409 `protected-principal`); (5) executa no Databricks; (6) grava o evento de auditoria. A operação é idempotente: repetir o mesmo corpo não gera erro e retorna `changed: false`.

        `X-Change-Ref` é obrigatório e vai para a auditoria. `Idempotency-Key` é opcional.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantChangeRequest'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantChangeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/workspaces/{ws}/catalogs/{catalog}/effective-grants:
    get:
      operationId: listCatalogEffectiveGrants
      summary: Lista os grants efetivos (incluindo herdados) de catalog
      tags:
      - Grants
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/PrincipalFilterParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveGrantList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/workspaces/{ws}/catalogs/{catalog}/owner:
    put:
      operationId: setCatalogOwner
      summary: Transfere a propriedade de catalog
      tags:
      - Ownership
      description: Idempotente. O novo dono deve existir no workspace (422 `principal-not-found`).
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdate'
      responses:
        '200':
