    post:
      operationId: grantOnSchema
      summary: Concede privilégios sobre schema
      tags:
      - Grants
      description: |-
        Fluxo: (1) valida o corpo e a matriz de privilégios por tipo de objeto (422 `privilege-not-applicable`); (2) confirma que cada principal existe (422 `principal-not-found`); (3) aplica a política de autorização do serviço; (4) rejeita mudanças que removeriam privilégios de principals protegidos do workspace (409 `protected-principal`); (5) executa no Databricks; (6) grava o evento de auditoria. A operação é idempotente: repetir o mesmo corpo não gera erro e retorna `changed: false`.

        `X-Change-Ref` é obrigatório e vai para a auditoria. `Idempotency-Key` é opcional.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/SchemaParam'
      - $ref: '#/components/parameters/ChangeRefHeader'
      - $ref: '#/components/parameters/IdempotencyKeyHeader'
      - $ref: '#/components/parameters/RequestIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantChangeRequest'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantChangeResult'
