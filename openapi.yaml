      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagValue'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
