      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '204':
          description: Removido com sucesso.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido pelo IdP corporativo (OIDC) para a identidade do serviço chamador.
    mutualTLS:
      type: mutualTLS
      description: Certificado de cliente emitido pela CA interna.
  parameters:
    WorkspaceParam:
      name: ws
      in: path
      required: true
      description: Alias do workspace no registry do serviço (não é o ID numérico do Databricks).
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9-]{1,62}$
        examples:
        - prod-br
    TagKeyParam:
      name: tag_key
      in: path
      required: true
      description: 'Chave da tag. Restrita a letras, dígitos e `_ . : @ = + -`.'
      schema:
        type: string
        pattern: ^[A-Za-z0-9_.:@=+-]{1,255}$
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    PageTokenParam:
      name: page_token
      in: query
      description: Token opaco retornado em `next_page_token`.
      schema:
        type: string
    PrincipalFilterParam:
      name: principal
      in: query
      description: Retorna apenas os privilégios deste principal.
      schema:
        type: string
    PrincipalTypeParam:
      name: type
      in: query
      schema:
        $ref: '#/components/schemas/PrincipalType'
    SearchQueryParam:
      name: q
      in: query
      description: Busca por prefixo (mínimo 2 caracteres).
      schema:
        type: string
        minLength: 2
        maxLength: 128
    ConfirmParam:
      name: confirm
      in: query
      required: true
      description: Deve ser igual ao nome completo do objeto a remover.
      schema:
        type: string
    ForceParam:
      name: force
      in: query
      description: Remove mesmo se o objeto não estiver vazio (cascata). Use com cuidado.
      schema:
        type: boolean
        default: false
    RequestIdHeader:
      name: X-Request-Id
      in: header
      description: ID de correlação. Se ausente, o serviço gera um. É propagado às chamadas ao Databricks.
      schema:
        type: string
        maxLength: 128
    ChangeRefHeader:
      name: X-Change-Ref
      in: header
      required: true
      description: Referência da mudança (ticket, change request). Obrigatória em toda escrita; vai para a auditoria.
      schema:
        type: string
        minLength: 3
        maxLength: 128
      example: TICKET-1234
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      description: 'Chave de idempotência (escopo: workspace + chamador + chave). Retenção de 24 h.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IdempotencyKeyRequiredHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Chave de idempotência (escopo: workspace + chamador + chave). Retenção de 24 h. Reutilizar a
        chave com corpo diferente retorna 409 `idempotency-conflict`.'
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CatalogParam:
      name: catalog
      in: path
      required: true
      description: Nome do objeto (catalog). Sem pontos, barras ou espaços.
      schema:
        type: string
        pattern: ^[^./\s]{1,255}$
    SchemaParam:
      name: schema
      in: path
      required: true
      description: Nome do objeto (schema). Sem pontos, barras ou espaços.
      schema:
        type: string
        pattern: ^[^./\s]{1,255}$
    TableParam:
      name: table
      in: path
      required: true
      description: Nome do objeto (table). Sem pontos, barras ou espaços.
      schema:
        type: string
        pattern: ^[^./\s]{1,255}$
    ViewParam:
      name: view
      in: path
      required: true
      description: Nome do objeto (view). Sem pontos, barras ou espaços.
      schema:
        type: string
        pattern: ^[^./\s]{1,255}$
    VolumeParam:
      name: volume
      in: path
      required: true
      description: Nome do objeto (volume). Sem pontos, barras ou espaços.
      schema:
        type: string
        pattern: ^[^./\s]{1,255}$
  headers:
    XRequestId:
      description: ID de correlação da requisição.
      schema:
        type: string
    RetryAfter:
      description: Segundos até a próxima tentativa.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Requisição malformada (JSON inválido, parâmetro fora do formato).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Credencial ausente ou inválida.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: A política do serviço (ou o Databricks) nega a operação. Inclui `protected-resource`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Workspace, objeto ou principal-alvo inexistente.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Conflito: objeto já existe, `protected-principal`, `idempotency-conflict` ou catálogo não vinculado
        ao workspace.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: 'Regra de domínio violada: `privilege-not-applicable`, `principal-not-found`, `confirmation-mismatch`,
        `validation-failed`.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Limite de taxa (do serviço ou do Databricks). Respeite `Retry-After`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Erro interno do serviço.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: Erro retornado pelo Databricks que não mapeia para um status específico. Veja `upstream`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: Databricks, Vault ou Postgres indisponível.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      description: RFC 9457 (`application/problem+json`).
      properties:
        type:
          type: string
          format: uri-reference
          description: 'Identificador do problema, ex.: `/problems/privilege-not-applicable`.'
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        request_id:
          type: string
        workspace:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 0
        errors:
          type: array
          description: Erros de validação por campo.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
        upstream:
          type: object
          description: Erro original do Databricks, quando houver.
          properties:
            error_code:
              type: string
              examples:
              - PERMISSION_DENIED
            message:
              type: string
            http_status:
              type: integer
      examples:
      - type: /problems/privilege-not-applicable
        title: Privilégio não aplicável
        status: 422
        detail: USE_SCHEMA não se aplica a TABLE.
        request_id: req_01J9Z
        workspace: prod-br
        errors:
        - field: changes[0].privileges[1]
          message: USE_SCHEMA não se aplica a TABLE
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - down
        checks:
          type: object
          additionalProperties:
            type: string
    SecurableType:
      type: string
      enum:
      - CATALOG
      - SCHEMA
      - TABLE
      - VIEW
      - VOLUME
    SecurableRef:
      type: object
      required:
      - type
      - name
      properties:
        type:
          $ref: '#/components/schemas/SecurableType'
        name:
          type: string
          description: Nome completo (catalog.schema.objeto).
          examples:
          - prod.vendas.pedidos
        metastore_id:
          type: string
          description: 'O metastore é compartilhado entre workspaces: o mesmo objeto pode ser alcançado por mais
            de um `ws`.'
    Privilege:
      type: string
      description: Allowlist de privilégios aceitos pelo serviço. A matriz de aplicabilidade por tipo de objeto
        é validada no servidor (422 `privilege-not-applicable`).
      enum:
      - ALL_PRIVILEGES
      - APPLY_TAG
      - BROWSE
      - CREATE_CONNECTION
      - CREATE_FUNCTION
      - CREATE_MATERIALIZED_VIEW
      - CREATE_MODEL
      - CREATE_SCHEMA
      - CREATE_TABLE
      - CREATE_VOLUME
      - EXECUTE
      - EXTERNAL_USE_SCHEMA
      - MANAGE
      - MODIFY
      - READ_VOLUME
      - REFRESH
      - SELECT
      - USE_CATALOG
      - USE_SCHEMA
      - WRITE_VOLUME
    PrincipalPrivileges:
      type: object
      required:
      - principal
      - privileges
      properties:
        principal:
          type: string
          minLength: 1
          maxLength: 255
          description: E-mail (usuário), nome (grupo) ou applicationId (service principal).
          examples:
          - grp-analytics
          - joao@empresa.com
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
    PrivilegeChange:
      type: object
      required:
      - principal
      - privileges
      additionalProperties: false
      properties:
        principal:
          type: string
          minLength: 1
          maxLength: 255
          description: E-mail (usuário), nome (grupo) ou applicationId (service principal).
          examples:
          - grp-analytics
          - joao@empresa.com
        privileges:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Privilege'
    GrantChangeRequest:
      type: object
      required:
      - changes
      additionalProperties: false
      description: Mesmo corpo para grant e revoke; a ação é definida pela rota.
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/PrivilegeChange'
      examples:
      - changes:
        - principal: grp-analytics
          privileges:
          - USE_SCHEMA
          - SELECT
    ChangeOutcome:
      type: object
      required:
      - principal
      - applied
      - unchanged
      properties:
        principal:
          type: string
        applied:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
          description: Privilégios efetivamente concedidos/revogados.
        unchanged:
          type: array
          items:
            $ref: '#/components/schemas/Privilege'
          description: Já estavam no estado pedido (no-op).
    GrantChangeResult:
      type: object
      required:
      - securable
      - outcomes
      - grants
      - changed
      - audit_id
      properties:
        securable:
          $ref: '#/components/schemas/SecurableRef'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/ChangeOutcome'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalPrivileges'
          description: Estado resultante dos grants diretos no objeto.
        changed:
          type: boolean
          description: '`false` se tudo foi no-op.'
        audit_id:
          type: string
      examples:
      - securable:
          type: SCHEMA
          name: prod.vendas
          metastore_id: a1b2c3
        outcomes:
        - principal: grp-analytics
          applied:
          - SELECT
          unchanged:
          - USE_SCHEMA
        grants:
        - principal: grp-analytics
          privileges:
          - USE_SCHEMA
          - SELECT
        changed: true
        audit_id: evt_01J9ZQ
    GrantList:
      type: object
      required:
      - securable
      - grants
      properties:
        securable:
          $ref: '#/components/schemas/SecurableRef'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/PrincipalPrivileges'
        next_page_token:
          type:
          - string
          - 'null'
    EffectivePrivilege:
      type: object
      required:
      - privilege
      properties:
        privilege:
          $ref: '#/components/schemas/Privilege'
        inherited_from_type:
          anyOf:
          - $ref: '#/components/schemas/SecurableType'
          - type: 'null'
        inherited_from_name:
          type:
          - string
          - 'null'
    EffectiveGrant:
      type: object
      required:
      - principal
      - privileges
      properties:
        principal:
          type: string
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/EffectivePrivilege'
    EffectiveGrantList:
      type: object
      required:
      - securable
      - grants
      properties:
        securable:
          $ref: '#/components/schemas/SecurableRef'
        grants:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveGrant'
        next_page_token:
          type:
          - string
          - 'null'
    Owner:
      type: object
      required:
      - owner
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 255
          description: E-mail (usuário), nome (grupo) ou applicationId (service principal).
          examples:
          - grp-analytics
          - joao@empresa.com
    OwnerUpdate:
      type: object
      required:
      - owner
      additionalProperties: false
      properties:
        owner:
          type: string
          minLength: 1
          maxLength: 255
          description: E-mail (usuário), nome (grupo) ou applicationId (service principal).
          examples:
          - grp-analytics
          - joao@empresa.com
    TagValue:
      type: object
      required:
      - value
      additionalProperties: false
      properties:
        value:
          type: string
          maxLength: 1000
    TagAssignment:
      type: object
      required:
      - key
      - value
      properties:
        key:
          type: string
        value:
          type: string
        updated_at:
          type: string
          format: date-time
    TagList:
      type: object
      required:
      - tags
      properties:
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagAssignment'
        next_page_token:
          type:
          - string
          - 'null'
          description: Ausente/nulo quando não há mais páginas.
    PrincipalType:
      type: string
      enum:
      - USER
      - GROUP
      - SERVICE_PRINCIPAL
    Principal:
      type: object
      required:
      - name
      - type
      properties:
        id:
          type: string
        name:
          type: string
          description: Valor a usar em grant/revoke.
        type:
          $ref: '#/components/schemas/PrincipalType'
        display_name:
          type:
          - string
          - 'null'
        active:
          type: boolean
    PrincipalList:
      type: object
      required:
      - principals
      properties:
        principals:
          type: array
          items:
            $ref: '#/components/schemas/Principal'
        next_page_token:
          type:
          - string
