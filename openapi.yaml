  /v1/workspaces/{ws}/catalogs/{catalog}/schemas/{schema}/volumes/{volume}/tags/{tag_key}:
    put:
      operationId: setVolumeTag
      summary: Cria ou atualiza uma tag de volume
      tags:
      - Tags
      description: Tags governadas exigem, no Databricks, permissão ASSIGN ou MANAGE na tag policy; a falta dela
        retorna 403.
      parameters:
      - $ref: '#/components/parameters/WorkspaceParam'
      - $ref: '#/components/parameters/CatalogParam'
      - $ref: '#/components/parameters/SchemaParam'
