      - $ref: '#/components/parameters/VolumeParam'
      - $ref: '#/components/parameters/PageSizeParam'
      - $ref: '#/components/parameters/PageTokenParam'
      - $ref: '#/components/parameters/RequestIdHeader'
      responses:
        '200':
          description: Sucesso.
          headers:
            X-Request-Id:
