services:
  governance-api-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: databricks-governance-service-python
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=local
      - LOG_LEVEL=debug
      - DATABASE_URL=postgresql://postgres:postgres@postgres-python:5432/governance_python
    depends_on:
      postgres-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - governance-net-python

  postgres-python:
    image: postgres:16-alpine
    container_name: databricks-governance-postgres-python
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=governance_python
    volumes:
      - postgres_python_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d governance_python"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - governance-net-python

networks:
  governance-net-python:
    driver: bridge

volumes:
  postgres_python_data:
